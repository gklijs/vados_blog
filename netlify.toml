[build]
  publish = "public"
  # Rust and vados are restored from the cache below when available, so rustup
  # only runs on a cold cache and `cargo install` only rebuilds vados when the
  # pinned version below changes.
  command = "([ -f \"$HOME/.cargo/env\" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable) && source \"$HOME/.cargo/env\" && cargo install vados --version 0.2.0 --locked && npm install && npm run build && vados generate --source root --img-source imgroot --destination public"

# Keeps the Rust toolchain and the compiled vados binary between builds.
# $HOME is /opt/buildhome on Netlify's build image.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["/opt/buildhome/.cargo", "/opt/buildhome/.rustup"]
