[build]
  publish = "public"
  # Downloads the vados release binary, checks it against the release's
  # checksum and builds the site, so no Rust toolchain is installed. The
  # binary goes to the build's home directory, outside the repository.
  command = """\
    archive="vados-$VADOS_VERSION-x86_64-unknown-linux-musl.tar.gz" \
    && release="https://github.com/gklijs/vados/releases/download/v$VADOS_VERSION" \
    && mkdir -p "$HOME/vados" \
    && (cd "$HOME/vados" \
      && curl --proto '=https' --tlsv1.2 -sSfL -O "$release/$archive" -O "$release/$archive.sha256" \
      && sha256sum -c "$archive.sha256" \
      && tar -xzf "$archive") \
    && npm install && npm run build \
    && "$HOME/vados/vados-$VADOS_VERSION-x86_64-unknown-linux-musl/vados" generate --source root --img-source imgroot --destination public --check-links\
    """

[build.environment]
  # The vados release this site builds with. Change it to upgrade.
  VADOS_VERSION = "0.6.0"

# Image variants keep their name when a photo is replaced, so they are cached
# for a week rather than forever. HTML and CSS keep Netlify's default of
# revalidating on every visit.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The Markdown version vados publishes next to every page ("markdown" in
# main.json), for agents and other readers that prefer it over HTML.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
